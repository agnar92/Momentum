
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momentum Dashboard</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Momentum">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" type="image/png">
</head>
<body>

<div class="topbar">
    <div class="topbar-left">
        <div class="brand">MOMENTUM<span class="brand-sub"> // SP500 · NASDAQ100 · DJIA</span></div>
        <button class="cmdk-trigger" id="cmdkTrigger">🔍 Szukaj <span class="cmdk-kbd">Ctrl+K</span></button>
    </div>
    <nav>
        <a href="index.html" class="active">Dashboard</a>
        <a href="rebalance.html">Rebalans</a>
    </nav>
</div>

<div class="cmdk-overlay" id="cmdkOverlay" style="display:none;">
    <div class="cmdk-box">
        <input type="text" id="cmdkInput" class="cmdk-input" placeholder="Szukaj tickera... (np. AAPL)" autocomplete="off">
        <div class="cmdk-results" id="cmdkResults"></div>
    </div>
</div>

<div class="workspace">

    <!-- ====================== LEWA KOLUMNA / SZUFLADA TABEL ====================== -->
    <div class="sidebar" id="sidebar">
        <button class="expand-btn" id="toggleDrawerBtn">&gt;&gt;&gt;</button>

        <div class="sidebar-group">
            <div class="sidebar-group-label">S&amp;P 500</div>
            <div class="ticker-grid" id="tiles-SP500"></div>
        </div>

        <div class="sidebar-group">
            <div class="sidebar-group-label">Nasdaq 100</div>
            <div class="ticker-grid" id="tiles-NASDAQ100"></div>
        </div>

        <div class="sidebar-group">
            <div class="sidebar-group-label">Dow Jones</div>
            <div class="ticker-grid" id="tiles-DOWJONES"></div>
        </div>

        <div class="sidebar-group" id="topBasketGroup">
            <div class="sidebar-group-label" title="Top momentum liderzy z SP500 (top 20) + NASDAQ100 (top 5) wg momentum score — koncentrowany koszyk, proxy quality bez dodatkowych danych fundamentalnych. Sklad zmienia sie tylko raz na 6 miesiecy (ograniczenie rotacji), ceny/momentum odswiezane co miesiac.">
                🏆 Top Momentum (quality proxy)
            </div>
            <div class="sidebar-group-meta" id="topBasketMeta"></div>
            <div class="ticker-grid" id="tiles-TOPBASKET"></div>
        </div>
    </div>

    <div class="table-drawer" id="tableDrawer">
        <div class="drawer-header">
            <div class="drawer-header-title">
                <h2 id="drawerTitle">Pełna tabela — S&amp;P 500 Momentum</h2>
                <div class="drawer-meta" id="drawerMeta"></div>
            </div>
            <div class="drawer-tabs">
                <button class="drawer-tab active" data-universe="SP500">S&amp;P 500</button>
                <button class="drawer-tab" data-universe="NASDAQ100">Nasdaq 100</button>
                <button class="drawer-tab" data-universe="DOWJONES">Dow Jones</button>
                <button class="drawer-tab" data-universe="TOPBASKET" title="Top Momentum (quality proxy) — SP500 top 20 + NASDAQ100 top 5, rebalans co 6 mies.">🏆 Top</button>
            </div>
        </div>
        <div class="table-scroll">
            <table class="momentum-table" id="momentumTable">
                <thead>
                    <tr>
                        <th data-key="rank">#</th>
                        <th data-key="ticker">Ticker</th>
                        <th data-key="sector">Sektor</th>
                        <th data-key="price">Cena</th>
                        <th data-key="momentum_pct">Momentum (12M-1M)</th>
                        <th data-key="momentum_window">Okno</th>
                        <th data-key="volatility_pct">Zmienność</th>
                        <th data-key="z_score">Z-score</th>
                        <th data-key="momentum_score">Momentum Score</th>
                        <th data-key="weight_pct">Waga</th>
                    </tr>
                </thead>
                <tbody id="momentumTableBody"></tbody>
            </table>

            <!-- Koszyk top-momentum (SP500 top20 + NASDAQ100 top5, rebalans co 6 mies.) —
                 osobna, prostsza tabela: nie ma tu portfelowej wagi/z-score/momentum score,
                 tylko surowe metryki + z których uniwersów pochodzi + czy dane są aktualne. -->
            <table class="momentum-table" id="topBasketTable" hidden>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Ticker</th>
                        <th>Sektor</th>
                        <th>Cena</th>
                        <th>Momentum (12M-1M)</th>
                        <th>Zmienność</th>
                        <th>Indeksy</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="topBasketTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- ====================== WYKRES TRADINGVIEW (pełny ekran, przełącznik TF w widgecie) ====================== -->
    <div class="charts-area">
        <button class="chart-back-btn" id="chartBackBtn">&larr; Lista spółek</button>
        <div class="chart-panel">
            <div class="chart-container" id="tv_chart"></div>
        </div>
    </div>

</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script src="js/app.js"></script>
</body>
</html>
