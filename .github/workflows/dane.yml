name: Dane spółek

# Co tydzień (sobota 05:23 UTC) i ręcznie: 500 największych spółek USA (Finviz) + raporty SEC + ceny tygodniowe (yfinance)
# -> docs/data/lista.json i docs/data/spolki/*.json, potem publikacja strony. Ręcznie: Actions -> "Dane spółek" -> Run workflow.
on:
  schedule:
    - cron: '23 5 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  dane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pobierz i przelicz dane
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
        run: python spolki.py
      - name: Dane GPW (WIG20 + mWIG40 + sWIG80)
        continue-on-error: true
        run: python gpw.py
      - name: Commit data
        run: |
          if [ -z "$(git status --porcelain docs/data)" ]; then
            echo "Brak zmian w danych."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/dane && cp -r docs/data /tmp/dane
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf docs/data && cp -r /tmp/dane docs/data
            git add -A docs/data
            git commit -m "chore: dane spółek [skip ci]"
            if git push; then exit 0; fi
            echo "Push odrzucony (próba $attempt) — ponawiam."
            sleep $((attempt * 3))
          done
          exit 1

  deploy:
    needs: dane
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
