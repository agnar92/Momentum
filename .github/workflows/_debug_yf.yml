name: Debug yfinance WIG20/MWIG40
on:
  push:
    branches: [debug/yf-wig20-diagnostic]
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance
      - run: python debug_yf_probe.py
