name: One-time 1-Year Backfill

on:
  workflow_dispatch: # Pozwala odpalić akcję ręcznie z zakładki Actions

# contents: write jest potrzebne, żeby workflow mógł odcommitować z powrotem
# momentum_data.duckdb wygenerowany przez backfill — kolejne comiesięczne
# uruchomienia (main.yml) budują na tej bazie zamiast zaczynać od zera.
permissions:
  contents: write
  pages: write
  id-token: write

# Zapobiega nakładaniu się równoległych wdrożeń
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Przyspiesza instalację, jeśli masz requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch initial data
        run: |
          python fetch_data.py

      - name: Run 1-Year Backfill Simulation
        run: |
          python backfill_year.py

      - name: Run final query for latest state
        run: |
          python run_query.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add momentum_data.duckdb
          git diff --staged --quiet && echo "Brak zmian w bazie." || git commit -m "Seed momentum_data.duckdb from backfill [skip ci]"
          git push origin HEAD:main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
