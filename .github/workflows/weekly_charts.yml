name: Weekly Charts Refresh

# Pełne pobranie cen (fetch_data.py, setki tickerów z yfinance — TO SAMO co
# main.yml) plus przeliczenie WYŁĄCZNIE wykresów (run_query.py --charts-only:
# bieżąca cena + weekly_chart/mansfield_chart dla KAŻDEJ spółki z ostatniej już
# zapisanej miesięcznej selekcji w portfolio_history + docs/data/all_prices.json).
# Selekcja/wagi/portfolio_history (kto jest w portfelu i z jaką wagą) zostają
# WYŁĄCZNIE miesięczne — patrz main.yml — to tutaj tylko odświeża dane pod
# wykresy "10:30"/Mansfield/ekran RSM (SMA10/30, Darvas boxy, RSM 3M/6M), żeby
# nie czekały cały miesiąc na świeże dane mimo że fetch_data.py::
# update_prices_incremental dogrywa nowe dni cen co tydzień.
#
# fetch_data.py samo przycina `prices` z powrotem do --lookback-months (22)
# przy KAŻDYM uruchomieniu (patrz update_prices_incremental w fetch_data.py),
# więc cotygodniowy fetch tutaj nie powiększa bazy ponad to okno — DB rośnie
# tylko o różnicę nowych dni minus przycięte stare, nie kumulatywnie.
on:
  schedule:
    # W sobotę rano, 07:00 UTC (poza kolizją z main.yml — 1. dnia miesiąca 06:00 UTC —
    # i daily_gem.yml — codziennie 22:30 UTC). GitHub Actions cron jest zawsze w UTC
    # (bez przejścia na czas letni) — 07:00 UTC to 08:00 czasu polskiego zimą / 09:00 latem.
    - cron: '0 7 * * 6'
  workflow_dispatch: # Umożliwia manualne kliknięcie "Run workflow" z poziomu GitHuba

# contents: write jest potrzebne, by workflow mógł commitować z powrotem
# momentum_data.duckdb (rolling okno cen, BEZ zmian w portfolio_history) oraz
# docs/data/*.json (odświeżone ceny/wykresy, BEZ zmian w selekcji/wagach).
permissions:
  contents: write
  pages: write
  id-token: write

# Ta sama grupa co main.yml/daily_gem.yml — zapobiega nakładaniu się równoległych
# wdrożeń Pages.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh-charts:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Market Data (full, not --indices-only)
        run: |
          python fetch_data.py

      - name: Recompute charts only (selection/weights stay from last monthly rebalance)
        run: |
          python run_query.py --charts-only

      - name: Persist generated data (momentum_data.duckdb + docs/data/*.json)
        run: |
          if [ -n "$(git status --porcelain momentum_data.duckdb docs/data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add momentum_data.duckdb docs/data/
            # [skip ci]: bez tego ten commit odpaliłby main.yml (trigger "push: main"),
            # uruchamiając pełny, kosztowny miesięczny rebalans co tydzień.
            git commit -m "chore: weekly charts refresh (prices + weekly_chart/mansfield_chart, selection unchanged) [skip ci]"
            # Retry na wypadek wyścigu z innym workflowem (main.yml/daily_gem.yml)
            # pushującym do main w tym samym momencie — patrz analogiczny komentarz
            # w main.yml.
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "❌ Push nie powiódł się po 5 próbach."
                exit 1
              fi
              echo "⚠️  Push odrzucony (próba $attempt) — pobieram najnowszy main i próbuję ponownie..."
              sleep $((attempt * 3))
              git fetch origin main
              git reset --soft origin/main
              git add momentum_data.duckdb docs/data/
              git commit -m "chore: weekly charts refresh (prices + weekly_chart/mansfield_chart, selection unchanged) [skip ci]"
            done
          else
            echo "Brak zmian w momentum_data.duckdb ani docs/data/ — pomijam commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
