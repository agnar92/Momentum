name: Movers

# Ręczny skan „Movers” na SAMYCH CENACH: lista ze skanera Finviz + 3 lata cen z yfinance tylko tych spółek (Dar-Card, średnie, wykresy tygodniowe i dzienne).
# Bez fundamentów. Parametry zmienne ustawiasz w polach poniżej: kapitalizacja, WOLUMEN Z DNIA (nie średni) i zmiana dnia. Warunki SMA są stałe:
# cena przecięła SMA20 i SMA50, cena nad SMA200 (movers_scan.py: SMA_FILTERS).
# Wynik: docs/data/watchlist_movers.json + charts_movers.json — NIE rusza watchlist.json / charts.json (lista CANSLIM, odświeżana raz w tygodniu).
#
# Ręczne odpalenie: zakładka Actions -> "Movers" -> "Run workflow" (albo przycisk „Odśwież dane” w zakładce Movers), lub lokalnie:
#   python movers_scan.py --cap cap_midover --min-volume 1000
on:
  workflow_dispatch:
    inputs:
      cap:
        description: 'Kapitalizacja od'
        type: choice
        default: cap_midover
        options:
          - cap_microover
          - cap_smallover
          - cap_midover
          - cap_largeover
      min_volume:
        description: 'Minimalny wolumen Z DNIA (tys. akcji; 1000 = 1 mln)'
        type: choice
        default: '1000'
        options: ['50', '100', '200', '300', '400', '500', '750', '1000', '2000', '3000', '4000', '5000', '10000']
      change:
        description: 'Zmiana dnia (Finviz: ta_change_u = wzrost, u3 = ponad +3 % itd.; brak = bez filtra)'
        type: choice
        default: ''
        options: ['', ta_change_u, ta_change_u1, ta_change_u2, ta_change_u3, ta_change_u4, ta_change_u5, ta_change_u6, ta_change_u7, ta_change_u8, ta_change_u9, ta_change_u10]
      filters:
        description: 'Zaawansowane: pełny filtr Finviz (kody po przecinku) zamiast pól powyżej; puste = użyj pól'
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

# Wspólna grupa z innymi workflowami: bez nakładających się wdrożeń Pages.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  movers:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Movers scan (Finviz list + yfinance prices)
        env:
          CAP: ${{ inputs.cap }}
          MIN_VOLUME: ${{ inputs.min_volume }}
          CHANGE: ${{ inputs.change }}
          FILTERS: ${{ inputs.filters }}
        run: python movers_scan.py --cap "$CAP" --min-volume "$MIN_VOLUME" --change "$CHANGE" ${FILTERS:+--filters "$FILTERS"}

      - name: Persist docs/data/*_movers.json
        run: |
          if [ -n "$(git status --porcelain docs/data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # Najpierw na AKTUALNY szczyt main ("reset --mixed"), żeby commit niósł tylko świeże dane na poprawnej bazie.
            git fetch origin main
            git reset --mixed origin/main
            git add docs/data/watchlist_movers.json docs/data/charts_movers.json
            # [skip ci]: bez tego commit odpaliłby kolejne workflowy (push: main).
            git commit -m "chore: Movers scan [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "❌ Push nie powiódł się po 5 próbach."
                exit 1
              fi
              echo "⚠️  Push odrzucony (próba $attempt) — pobieram najnowszy main i próbuję ponownie..."
              sleep $((attempt * 3))
              git fetch origin main
              git reset --mixed origin/main
              git add docs/data/watchlist_movers.json docs/data/charts_movers.json
              git commit -m "chore: Movers scan [skip ci]"
            done
          else
            echo "Brak zmian w docs/data/ — pomijam commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
