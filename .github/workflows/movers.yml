name: Movers

# Ręczny skan „Movers” na SAMYCH CENACH z ZAPAMIĘTANYMI LISTAMI. Lista = nazwa + filtr Finviz (pole `filters`); listy są zapisane w docs/data/movers_lists.json
# (workflow je pamięta między uruchomieniami). Każde uruchomienie skanuje WSZYSTKIE listy, pobiera 3 lata cen yfinance dla sumy spółek (Dar-Card, średnie,
# wykresy dzienne i tygodniowe), bez fundamentów. W aplikacji listy są podkategoriami zakładki Movers.
#   action = add     -> dodaj listę (name + filters) albo zmień filtr listy o tej nazwie
#   action = remove  -> usuń listę o podanej nazwie (name)
#   action = refresh -> odśwież wszystkie listy (name i filters są pomijane)
# Filtr: kody Finviz po przecinku (cap_midover,sh_curvol_o1000,…), zapis `cap:midover sh_curvol:o1000 ta_sma20:pc` albo cały link ze skanera Finviz.
# Wynik: docs/data/movers_lists.json + watchlist_movers.json + charts_movers.json — NIE rusza watchlist.json / charts.json (lista CANSLIM, odświeżana raz w tygodniu).
#
# Ręczne odpalenie: zakładka Actions -> "Movers" -> "Run workflow" (albo przycisk „Odśwież dane” w zakładce Movers), lub lokalnie:
#   python movers_scan.py --action add --name "Wolumen" --filters "cap:midover sh_curvol:o1000 ta_change:u5 ta_sma20:pc ta_sma200:pa ta_sma50:pc"
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Akcja: add = dodaj / zmień listę, remove = usuń listę, refresh = odśwież wszystkie'
        type: choice
        default: refresh
        options: [refresh, add, remove]
      name:
        description: 'Nazwa listy (dla add i remove)'
        default: ''
      filters:
        description: 'Filtr Finviz dla add: kody (cap_midover,sh_curvol_o1000,…), zapis cap:midover sh_curvol:o1000 … albo cały link ze skanera'
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

# Wspólna grupa z innymi workflowami: bez nakładających się wdrożeń Pages.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  movers:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Movers scan (saved lists + Finviz + yfinance prices)
        env:
          ACTION: ${{ inputs.action }}
          LIST_NAME: ${{ inputs.name }}
          FILTERS: ${{ inputs.filters }}
        run: python movers_scan.py --action "$ACTION" --name "$LIST_NAME" --filters "$FILTERS"

      - name: Persist docs/data/*_movers.json
        run: |
          if [ -n "$(git status --porcelain docs/data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # Najpierw na AKTUALNY szczyt main ("reset --mixed"), żeby commit niósł tylko świeże dane na poprawnej bazie.
            git fetch origin main
            git reset --mixed origin/main
            git add docs/data/movers_lists.json docs/data/watchlist_movers.json docs/data/charts_movers.json
            # [skip ci]: bez tego commit odpaliłby kolejne workflowy (push: main).
            git commit -m "chore: Movers scan [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "❌ Push nie powiódł się po 5 próbach."
                exit 1
              fi
              echo "⚠️  Push odrzucony (próba $attempt) — pobieram najnowszy main i próbuję ponownie..."
              sleep $((attempt * 3))
              git fetch origin main
              git reset --mixed origin/main
              git add docs/data/movers_lists.json docs/data/watchlist_movers.json docs/data/charts_movers.json
              git commit -m "chore: Movers scan [skip ci]"
            done
          else
            echo "Brak zmian w docs/data/ — pomijam commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
