name: Daily Watchlist Refresh

# Codziennie rano (po zakończonej sesji USA z poprzedniego dnia, żeby na nowe otwarcie mieć świeże
# dane z dnia poprzedniego): watchlist.py pobiera listę spółek z Finviz (nad SMA50 i SMA200, stabilny
# wzrost EPS i dodatnie prognozy EPS), ceny z yfinance i liczy RS Rating, dane do filtra Qullamaggiego
# i trend EMA34 -> docs/data/watchlist.json, który następnie trafia na GitHub Pages.
#
# Ręczne odpalenie: zakładka Actions -> "Daily Watchlist Refresh" -> "Run workflow"
# (na stronie jest przycisk "Odśwież dane", który prowadzi właśnie tutaj) albo lokalnie:
#   python watchlist.py
on:
  schedule:
    # 05:30 UTC (07:30 latem / 06:30 zimą w Polsce), wtorek-sobota = po sesjach pon-pt USA.
    # GitHub Actions liczy cron w UTC, bez przejścia na czas letni.
    - cron: '30 5 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Zapobiega nakładaniu się równoległych wdrożeń Pages.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Finviz list + yfinance prices and build watchlist.json
        run: python watchlist.py

      - name: Persist docs/data/watchlist.json
        run: |
          if [ -n "$(git status --porcelain docs/data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # Zawsze najpierw na AKTUALNY szczyt main ("reset --mixed", nie --soft), żeby commit
            # niósł tylko świeże dane na poprawnej bazie — nawet gdy job wystartował ze starego
            # checkoutu (np. ręczne "Re-run jobs" używa ORYGINALNEGO SHA, nie bieżącego main).
            git fetch origin main
            git reset --mixed origin/main
            git add docs/data/
            # [skip ci]: bez tego commit odpaliłby kolejne workflowy (push: main).
            git commit -m "chore: daily watchlist refresh [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "❌ Push nie powiódł się po 5 próbach."
                exit 1
              fi
              echo "⚠️  Push odrzucony (próba $attempt) — pobieram najnowszy main i próbuję ponownie..."
              sleep $((attempt * 3))
              git fetch origin main
              git reset --mixed origin/main
              git add docs/data/
              git commit -m "chore: daily watchlist refresh [skip ci]"
            done
          else
            echo "Brak zmian w docs/data/ — pomijam commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
