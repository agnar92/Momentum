name: Daily Watchlist Refresh

# Codziennie po sesji w Nowym Jorku (pon–pt wieczorem; Darvas liczy boxy na DZIENNYCH zamknięciach z ostatnich 12 miesięcy — charts.json `daily`, reszta analizy nadal tygodniowa;
# plik zostaje pod starą nazwą daily_watchlist.yml, bo na niego wskazuje link „Odśwież dane” na stronie): watchlist.py pobiera JEDNĄ listę spółek z Finviz (filtr CANSLIM z finviz_screen.json: wzrost EPS i sprzedaży,
# ROE, kapitalizacja od 300 mln, płynność), ceny z yfinance i liczy RS Rating, bazy, metryki cenowe
# (obrót, ADR %, cena / minimum) -> docs/data/watchlist.json + charts.json, które następnie trafiają na GitHub Pages.
#
# Pobieranie i obliczenia w jednym przebiegu (jak dawniej) + zapis migawki pobranych danych (gałąź raw-data). Same obliczenia, bez pobierania, robi
# deploy strony (deploy.yml) po każdym pushu do main oraz ręczny workflow "Recompute Watchlist" (watchlist.py --compute-only).
#
# Ręczne odpalenie: zakładka Actions -> "Weekly Watchlist Refresh" -> "Run workflow"
# (na stronie jest przycisk "Odśwież dane", który prowadzi właśnie tutaj) albo lokalnie:
#   python watchlist.py
on:
  schedule:
    # Pon–pt 21:30 UTC = po zamknięciu NYSE (16:00 w Nowym Jorku to 20:00 UTC latem i 21:00 UTC zimą) i po 22:00 czasu polskiego (22:30 zimą / 23:30 latem).
    # GitHub Actions liczy cron w UTC, bez przejścia na czas letni, a przy dużym ruchu opóźnia starty nawet o kilkadziesiąt minut.
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

# Zapobiega nakładaniu się równoległych wdrożeń Pages.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Blokada ponownego uruchomienia starego runu
        if: ${{ github.run_attempt > 1 }}
        run: |
          echo "❌ To jest PONOWNE uruchomienie (Re-run jobs) starego runu — GitHub użyłby starego kodu i starych danych wejściowych i nadpisałby listy. Użyj 'Run workflow' i wpisz akcję / nazwę / filtr od nowa."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Poprzednia migawka pobranych danych (gałąź raw-data): gdy pobieranie któregoś profilu się nie uda, liczymy z poprzedniej.
      - name: Restore previous raw snapshot
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: raw-data
          path: raw

      # Pobieranie i obliczenia w jednym przebiegu. --save-raw: przy okazji zapisuje migawkę pobranych danych (raw/), z której deploy strony liczy wszystko od nowa po każdej zmianie kodu.
      - name: Fetch CANSLIM list (Finviz pre-screen + yfinance) and build watchlist.json
        run: python watchlist.py --save-raw

      # Migawka trafia do osobnej gałęzi raw-data (jeden commit, wymieniany za każdym razem), skąd bierze ją deploy strony i workflow „Recompute Watchlist”.
      - name: Publish raw snapshot (branch raw-data)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! ls raw/*.pkl.gz >/dev/null 2>&1; then
            echo "Brak migawki — pomijam publikację."
            exit 0
          fi
          rm -rf /tmp/rawpub && mkdir /tmp/rawpub
          cp raw/*.pkl.gz /tmp/rawpub/
          cd /tmp/rawpub
          git init -q -b raw-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "raw snapshot $(date -u +%F)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" raw-data

      # Opcjonalnie: powiadomienie (Issue + e-mail / push z GitHub Mobile) o nowych przebiciach Twoich linii z alertem.
      # Wymaga sekretu GIST_TOKEN (ten sam token z uprawnieniem "gist", co w synchronizacji); bez niego krok nic nie robi.
      - name: Alert notifications (optional)
        continue-on-error: true
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python alerts_notify.py

      # Nowe sygnały karty Darvasa (KUP / GOTOWE / SPRZEDAJ dla pozycji) → Issue „📦 Darvas — sygnały” (e-mail / push). Działa bez GIST_TOKEN (wtedy bez pozycji).
      - name: Darvas notifications
        continue-on-error: true
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: DARVAS_WEEKLY=${{ github.event_name == 'schedule' && '1' || '0' }} python darvas_notify.py

      - name: Persist docs/data/watchlist.json
        run: |
          if [ -n "$(git status --porcelain docs/data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # Zawsze najpierw na AKTUALNY szczyt main ("reset --mixed", nie --soft), żeby commit
            # niósł tylko świeże dane na poprawnej bazie — nawet gdy job wystartował ze starego
            # checkoutu (np. ręczne "Re-run jobs" używa ORYGINALNEGO SHA, nie bieżącego main).
            git fetch origin main
            git reset --mixed origin/main
            git add docs/data/
            # [skip ci]: bez tego commit odpaliłby kolejne workflowy (push: main).
            git commit -m "chore: daily watchlist refresh [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "❌ Push nie powiódł się po 5 próbach."
                exit 1
              fi
              echo "⚠️  Push odrzucony (próba $attempt) — pobieram najnowszy main i próbuję ponownie..."
              sleep $((attempt * 3))
              git fetch origin main
              git reset --mixed origin/main
              git add docs/data/
              git commit -m "chore: daily watchlist refresh [skip ci]"
            done
          else
            echo "Brak zmian w docs/data/ — pomijam commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
