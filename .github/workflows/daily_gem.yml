name: Daily Global Equity Momentum Update

# Global Equity Momentum (docs/data/global_equity_momentum.json) i sila relatywna
# (docs/data/relative_strength.json) porownuja POZIOM INDEKSU (^NDX/^DJI/WIG20.WA/
# MWIG40.WA, tylko 4 symbole) — w przeciwienstwie do pelnego przeliczenia glownych
# uniwersow (main.yml, raz w miesiacu: setki tickerow z yfinance), to odswiezenie jest tanie,
# wiec robimy je codziennie, zeby zwyciezca/liderzy faktycznie odzwierciedlali
# biezacy trend, a nie sprzed miesiaca.
on:
  schedule:
    # Codziennie o 22:30 UTC (po zamknieciu sesji na NYSE/NASDAQ)
    - cron: '30 22 * * *'
  workflow_dispatch: # Umożliwia manualne kliknięcie "Run workflow" z poziomu GitHuba

# contents: write jest potrzebne, by workflow mógł commitować z powrotem
# momentum_data.duckdb (nowe wiersze w tabeli index_prices) oraz
# docs/data/global_equity_momentum.json + docs/data/relative_strength.json.
permissions:
  contents: write
  pages: write
  id-token: write

# Ta sama grupa co main.yml — zapobiega nakładaniu się równoległych wdrożeń Pages.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-index-momentum:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # docs/data/*.json jest teraz commitowane do repo (patrz .gitignore / krok
      # "Persist generated data" w main.yml), więc świeży checkout wyżej już zawiera
      # nasdaq100.json/dowjones.json/wig20.json/mwig40.json/all_prices.json z
      # ostatniego pełnego przebiegu (main.yml) — nie trzeba ich już ściągać z
      # opublikowanej strony. Ten workflow przelicza WYŁĄCZNIE
      # global_equity_momentum.json + relative_strength.json (oba --gem-only,
      # patrz niżej) i commituje z powrotem tylko te dwa pliki; "Upload artifact"
      # niżej pakuje cały katalog docs/ (te przeliczone + resztę z checkoutu), więc
      # opublikowana strona nigdy nie traci tabel momentum/rebalansu.
      - name: Fetch index-level data only (^GSPC/^NDX/^DJI)
        run: |
          python fetch_data.py --indices-only

      - name: Recompute Global Equity Momentum + relative strength only
        run: |
          python run_query.py --gem-only

      - name: Persist generated data (momentum_data.duckdb + daily GEM/RS json)
        run: |
          FILES="momentum_data.duckdb docs/data/global_equity_momentum.json docs/data/relative_strength.json"
          if [ -n "$(git status --porcelain $FILES)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $FILES
            # [skip ci]: bez tego ten commit odpaliłby workflow main.yml (trigger "push: main")
            # i uruchomił pełne, kosztowne miesięczne odświeżenie codziennie.
            git commit -m "chore: update momentum_data.duckdb + daily GEM/RS json (daily index_prices refresh) [skip ci]"
            # Retry na wypadek wyścigu z innym workflowem (np. main.yml) pushującym do
            # main w tym samym momencie — patrz analogiczny komentarz w main.yml.
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "❌ Push nie powiódł się po 5 próbach."
                exit 1
              fi
              echo "⚠️  Push odrzucony (próba $attempt) — pobieram najnowszy main i próbuję ponownie..."
              sleep $((attempt * 3))
              git fetch origin main
              git reset --soft origin/main
              git add $FILES
              git commit -m "chore: update momentum_data.duckdb + daily GEM/RS json (daily index_prices refresh) [skip ci]"
            done
          else
            echo "Brak zmian w momentum_data.duckdb ani w docs/data/ — pomijam commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
