name: Daily Global Equity Momentum Update

# Global Equity Momentum (docs/data/global_equity_momentum.json) i sila relatywna
# (docs/data/relative_strength.json) porownuja POZIOM INDEKSU (^GSPC/^NDX/^DJI,
# tylko 3 symbole) — w przeciwienstwie do pelnego przeliczenia 3 glownych uniwersow
# (main.yml, raz w miesiacu: setki tickerow z yfinance), to odswiezenie jest tanie,
# wiec robimy je codziennie, zeby zwyciezca/liderzy faktycznie odzwierciedlali
# biezacy trend, a nie sprzed miesiaca.
on:
  schedule:
    # Codziennie o 22:30 UTC (po zamknieciu sesji na NYSE/NASDAQ)
    - cron: '30 22 * * *'
  workflow_dispatch: # Umożliwia manualne kliknięcie "Run workflow" z poziomu GitHuba

# contents: write jest potrzebne, by workflow mógł commitować z powrotem
# momentum_data.duckdb (nowe wiersze w tabeli index_prices).
permissions:
  contents: write
  pages: write
  id-token: write

# Ta sama grupa co main.yml — zapobiega nakładaniu się równoległych wdrożeń Pages.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-index-momentum:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # docs/data/*.json jest gitignorowane (patrz .gitignore) — normalnie istnieje
      # tylko lokalnie po pełnym przebiegu run_query.py (main.yml). Ten workflow
      # przelicza WYŁĄCZNIE global_equity_momentum.json + relative_strength.json
      # (oba --gem-only, patrz niżej), więc żeby "Upload artifact" niżej nie
      # podmieniło całej opublikowanej strony tylko tymi dwoma plikami (i nie
      # skasowało tabel momentum/rebalansu), najpierw ściągamy resztę plików z
      # aktualnie opublikowanej strony — oba przeliczane pliki i tak zostaną
      # zaraz nadpisane świeżym przeliczeniem.
      - name: Restore currently published data files
        run: |
          mkdir -p docs/data
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          BASE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/data"
          for f in sp500.json nasdaq100.json dowjones.json all_prices.json equity_curve.json; do
            if curl -fsS -o "docs/data/$f" "$BASE_URL/$f"; then
              echo "✅ Pobrano $f z opublikowanej strony."
            else
              echo "⚠️  Nie udało się pobrać $f (pierwszy deploy?) — pomijam."
              rm -f "docs/data/$f"
            fi
          done

      - name: Fetch index-level data only (^GSPC/^NDX/^DJI)
        run: |
          python fetch_data.py --indices-only

      - name: Recompute Global Equity Momentum + relative strength only
        run: |
          python run_query.py --gem-only

      - name: Persist momentum_data.duckdb
        run: |
          if [ -n "$(git status --porcelain momentum_data.duckdb)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add momentum_data.duckdb
            # [skip ci]: bez tego ten commit odpaliłby workflow main.yml (trigger "push: main")
            # i uruchomił pełne, kosztowne miesięczne odświeżenie codziennie.
            git commit -m "chore: update momentum_data.duckdb (daily index_prices refresh) [skip ci]"
            git push
          else
            echo "Brak zmian w momentum_data.duckdb — pomijam commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
