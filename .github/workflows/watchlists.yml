name: Watchlisty

# Ręczne WATCHLISTY z pełną analizą TYGODNIOWĄ (RS Rating, EPS Rating, Composite, Dar-Card, wykres słupkowy). Lista = nazwa + filtr Finviz (pole `filters`);
# listy są zapisane w docs/data/watchlists_def.json (workflow je pamięta między uruchomieniami). Każda akcja robi tylko swoje: add skanuje tylko dodaną / zmienioną listę, remove tylko usuwa listę (bez sieci), refresh skanuje WSZYSTKIE listy; skan pobiera ceny i EPS sumy
# spółek (bez duplikatów) i liczy oceny — percentyle wśród spółek ze wszystkich list razem. W aplikacji listy są podkategoriami zakładki Watchlisty. Wykresów dziennych nie ma.
#   action = add     -> dodaj listę (name + filters) albo zmień filtr listy o tej nazwie
#   action = remove  -> usuń listę o podanej nazwie (name), bez odświeżania pozostałych
#   action = refresh -> odśwież wszystkie listy (name i filters są pomijane)
# Filtr: kody Finviz po przecinku (cap_midover,sh_avgvol_o1000,…), zapis `cap:midover sh_avgvol:o1000 ta_sma20:pa` albo cały link ze skanera Finviz.
# Wynik: docs/data/watchlists_def.json + watchlists.json + charts_watchlists.json + eps_cache_watchlists.json — NIE rusza watchlist.json / charts.json (lista CANSLIM, odświeżana raz w tygodniu).
#
# Ręczne odpalenie: zakładka Actions -> "Watchlisty" -> "Run workflow" (albo przycisk „Odśwież dane” w zakładce Watchlisty), lub lokalnie:
#   python watchlists_scan.py --action add --name "Wolumen" --filters "cap:midover sh_avgvol:o1000 ta_change:u5 ta_sma20:pa ta_sma200:pa"
on:
  # Codziennie po sesji w Nowym Jorku (pon–pt 21:50 UTC, po „Daily Watchlist Refresh” o 21:30 — wspólna kolejka „pages”): refresh wszystkich list,
  # żeby stan karty Darvasa (Do kupna / Kup dziś / Gotowe) i powiadomienia liczyły się z dzisiejszego zamknięcia. Z harmonogramu akcja = refresh.
  schedule:
    - cron: '50 21 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: 'Akcja: add = dodaj / zmień listę (skan tylko jej), remove = usuń listę (bez odświeżania), refresh = odśwież wszystkie'
        type: choice
        default: refresh
        options: [refresh, add, remove]
      name:
        description: 'Nazwa listy (dla add i remove)'
        default: ''
      filters:
        description: 'Filtr Finviz dla add: kody (cap_midover,sh_curvol_o1000,…), zapis cap:midover sh_curvol:o1000 … albo cały link ze skanera'
        default: ''

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

# Wspólna grupa z innymi workflowami: bez nakładających się wdrożeń Pages.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  watchlists:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Blokada ponownego uruchomienia starego runu
        if: ${{ github.run_attempt > 1 }}
        run: |
          echo "❌ To jest PONOWNE uruchomienie (Re-run jobs) starego runu — GitHub użyłby starego kodu i starych danych wejściowych i nadpisałby listy. Użyj 'Run workflow' i wpisz akcję / nazwę / filtr od nowa."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Watchlisty scan (saved lists + Finviz + yfinance prices + EPS)
        env:
          ACTION: ${{ inputs.action || 'refresh' }}   # z harmonogramu inputs są puste
          LIST_NAME: ${{ inputs.name }}
          FILTERS: ${{ inputs.filters }}
        run: python watchlists_scan.py --action "$ACTION" --name "$LIST_NAME" --filters "$FILTERS"

      - name: Persist docs/data/watchlists*.json
        run: |
          if [ -n "$(git status --porcelain docs/data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # Najpierw na AKTUALNY szczyt main ("reset --mixed"), żeby commit niósł tylko świeże dane na poprawnej bazie.
            git fetch origin main
            git reset --mixed origin/main
            git add docs/data/watchlists_def.json docs/data/watchlists.json docs/data/charts_watchlists.json docs/data/eps_cache_watchlists.json
            # [skip ci]: bez tego commit odpaliłby kolejne workflowy (push: main).
            git commit -m "chore: Watchlisty scan [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "❌ Push nie powiódł się po 5 próbach."
                exit 1
              fi
              echo "⚠️  Push odrzucony (próba $attempt) — pobieram najnowszy main i próbuję ponownie..."
              sleep $((attempt * 3))
              git fetch origin main
              git reset --mixed origin/main
              git add docs/data/watchlists_def.json docs/data/watchlists.json docs/data/charts_watchlists.json docs/data/eps_cache_watchlists.json
              git commit -m "chore: Watchlisty scan [skip ci]"
            done
          else
            echo "Brak zmian w docs/data/ — pomijam commit."
          fi

      # Powiadomienia o nowych sygnałach karty Darvasa (Issue „📦 Darvas — sygnały” → e-mail / push GitHub Mobile); GIST_TOKEN opcjonalny (sygnały SPRZEDAJ dla Twoich pozycji).
      - name: Darvas notifications
        continue-on-error: true
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python darvas_notify.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
