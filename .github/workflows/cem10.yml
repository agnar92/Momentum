name: CEM10 Monthly

# 1. dnia miesiąca: lista CEM10 (USA: S&P 500 / Nasdaq-100, lider SPY/QQQ 5M; GPW: WIG20 + mWIG40, C-8) z zamknięć ostatniego
# zamkniętego miesiąca -> docs/data/cem10.json, potem publikacja strony (docs/cem10.html). Ręcznie: Actions -> "CEM10 Monthly" -> Run workflow.
on:
  schedule:
    - cron: '23 6 1 * *'   # 1. dnia miesiąca, 06:23 UTC (po zamknięciu ostatniej sesji poprzedniego miesiąca)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lista CEM10 (Wikipedia + cem10_windows/sklad_gpw.json + yfinance)
        run: python cem10.py

      - name: Commit data
        run: |
          if [ -z "$(git status --porcelain docs/data/cem10.json)" ]; then
            echo "Brak zmian w danych."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp docs/data/cem10.json /tmp/cem10.json
          for attempt in 1 2 3 4 5; do
            # zawsze na AKTUALNY main, commit niesie tylko listę CEM10
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/cem10.json docs/data/cem10.json
            git add docs/data/cem10.json
            git commit -m "chore: CEM10 monthly list [skip ci]"
            if git push; then exit 0; fi
            echo "Push odrzucony (próba $attempt) — ponawiam."
            sleep $((attempt * 3))
          done
          exit 1

  deploy:
    needs: refresh
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Recalculate indicators from cached data (no market-data downloads)
        run: python watchlist.py --build-only
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
