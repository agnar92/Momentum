name: Monthly SPMO Portfolio Rebalance

on:
  schedule:
    # Uruchamiaj 1. dnia każdego miesiąca o 06:00 UTC
    - cron: '0 6 1 * *'
  push:
    branches: [main]
  workflow_dispatch: # Umożliwia manualne kliknięcie "Run workflow" z poziomu GitHuba

# contents: write jest potrzebne, by workflow mógł commitować z powrotem
# momentum_data.duckdb (rolling okno cen + trwała historia portfolio_history —
# patrz krok "Persist momentum_data.duckdb" niżej).
permissions:
  contents: write
  pages: write
  id-token: write

# Zapobiega nakładaniu się równoległych wdrożeń
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Market Data
        run: |
          python fetch_data.py

      - name: Run Momentum Query and Generate json data for page
        run: |
          python run_query.py

      - name: Persist momentum_data.duckdb
        run: |
          if [ -n "$(git status --porcelain momentum_data.duckdb)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add momentum_data.duckdb
            # [skip ci]: bez tego ten commit odpaliłby workflow ponownie (trigger "push: main"),
            # tworząc pętlę.
            git commit -m "chore: update momentum_data.duckdb (rolling price window + portfolio_history) [skip ci]"
            git push
          else
            echo "Brak zmian w momentum_data.duckdb — pomijam commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
