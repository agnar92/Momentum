name: Monthly SPMO Portfolio Rebalance

on:
  schedule:
    # Uruchamiaj 1. dnia każdego miesiąca o 06:00 UTC
    - cron: '0 6 1 * *'
  push:
    branches: [main]
  workflow_dispatch: # Umożliwia manualne kliknięcie "Run workflow" z poziomu GitHuba

# contents: write jest potrzebne, żeby workflow mógł odcommitować z powrotem
# zaktualizowany momentum_data.duckdb (patrz krok "Commit updated database" —
# bez tego baza cen i portfolio_history znikałyby po każdym uruchomieniu,
# bo każdy run CI startuje od świeżego checkoutu repo).
permissions:
  contents: write
  pages: write
  id-token: write

# Zapobiega nakładaniu się równoległych wdrożeń
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Market Data
        run: |
          python fetch_data.py

      - name: Run Momentum Query and Generate json data for page
        run: |
          python run_query.py

      # momentum_data.duckdb trzyma historię cen (żeby nie zależeć w 100% od
      # tego, czy Yahoo odpowie poprawnie w TYM konkretnym uruchomieniu) oraz
      # portfolio_history (potrzebne regule bufora 80–120% w run_query.py,
      # żeby ograniczać obrót — bez trwałej bazy każdy rebalans wygląda jak
      # pierwszy w historii). Commitujemy go z powrotem do repo po każdym
      # uruchomieniu. Push przez domyślny GITHUB_TOKEN nie triggeruje kolejnego
      # workflow (standardowe zabezpieczenie GitHuba przed pętlą), a [skip ci]
      # to dodatkowe zabezpieczenie, gdyby kiedyś użyto tu innego tokenu.
      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add momentum_data.duckdb
          git diff --staged --quiet && echo "Brak zmian w bazie." || git commit -m "Update momentum_data.duckdb [skip ci]"
          git push origin HEAD:main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
