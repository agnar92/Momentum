name: Monthly SPMO Portfolio Rebalance

on:
  schedule:
    # Uruchamiaj 1. dnia każdego miesiąca o 06:00 UTC
    - cron: '0 6 1 * *'
  workflow_dispatch: # Umożliwia manualne kliknięcie "Run workflow" z poziomu GitHuba

# Wymagane uprawnienia do publikacji na GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Zapobiega nakładaniu się równoległych wdrożeń
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Market Data
        run: |
          python fetch_data.py

      - name: Run Momentum Query and Generate HTML
        run: |
          python run_query.py 2

  
      - name: Prepare HTML for github pages
        run: |
          cp portfel_rebalans.html index.html
o

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Publikujemy cały katalog (w którym run_query.py zapisał index.html)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
