name: Deploy Pages (bez pobierania danych)

# Zwykły deploy strony — publikuje aktualną zawartość docs/ na GitHub Pages BEZ pobierania danych.
# Dane (docs/data/watchlist.json) są zacommitowane w repo i odświeża je daily_watchlist.yml, więc
# zmianę samego kodu strony (HTML/CSS/JS) wystarczy tylko wdrożyć.
on:
  push:
    branches: [main]
  workflow_dispatch: # Umożliwia manualne kliknięcie "Run workflow" z poziomu GitHuba

permissions:
  contents: read
  pages: write
  id-token: write

# Ta sama grupa co w daily_watchlist.yml, żeby wdrożenia Pages się nie
# nakładały.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
