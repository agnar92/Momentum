name: Quality Yearly

# Raz w roku (2 stycznia): ranking jakości — sito Finviz (finviz_screen.json `quality_filters`) + 10 lat raportów rocznych SEC
# -> docs/data/quality.json, potem publikacja strony (docs/quality.html). Ręcznie: Actions -> "Quality Yearly" -> Run workflow.
on:
  schedule:
    - cron: '41 5 2 1 *'   # 2 stycznia, 05:41 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ranking jakości (Finviz + SEC + opcjonalnie Gemini)
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # opcjonalny: podpowiedzi AI dla top 30 (klucz z aistudio.google.com)
        run: python quality.py

      - name: Commit data
        run: |
          if [ -z "$(git status --porcelain docs/data/quality.json)" ]; then
            echo "Brak zmian w danych."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp docs/data/quality.json /tmp/quality.json
          for attempt in 1 2 3 4 5; do
            # zawsze na AKTUALNY main, commit niesie tylko ranking jakości
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/quality.json docs/data/quality.json
            git add docs/data/quality.json
            git commit -m "chore: quality ranking [skip ci]"
            if git push; then exit 0; fi
            echo "Push odrzucony (próba $attempt) — ponawiam."
            sleep $((attempt * 3))
          done
          exit 1

  deploy:
    needs: refresh
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Recalculate indicators from cached data (no market-data downloads)
        run: python watchlist.py --build-only
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
