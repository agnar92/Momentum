name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      # GitHub rejestruje wgraną paczkę z opóźnieniem — bez przerwy publikacja często kończyła się „No artifacts named github-pages were found”
      - name: Odczekaj na rejestrację paczki
        run: sleep 20
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # GitHub Pages bywa chwilowo niedostępny („No artifacts named github-pages were found”, „Deployment failed, try again later”) — ponów po minucie
      - name: Odczekaj przed ponowieniem
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (ponowienie)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
