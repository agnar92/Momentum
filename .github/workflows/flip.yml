name: FLIP Monthly

# 2. dnia miesiąca: lista FLIP (spółki USA > 10 mld $ z Finviz, litery F/L/I/P z flip_config.json, ostatni kwartał z SEC)
# -> docs/data/flip.json, potem publikacja strony (docs/flip.html). Ręcznie: Actions -> "FLIP Monthly" -> Run workflow.
on:
  schedule:
    - cron: '41 7 2 * *'   # 2. dnia miesiąca, 07:41 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lista FLIP (Finviz + SEC)
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
        run: python flip.py

      - name: Commit data
        run: |
          if [ -z "$(git status --porcelain docs/data/flip.json)" ]; then
            echo "Brak zmian w danych."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp docs/data/flip.json /tmp/flip.json
          for attempt in 1 2 3 4 5; do
            # zawsze na AKTUALNY main, commit niesie tylko listę FLIP
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/flip.json docs/data/flip.json
            git add docs/data/flip.json
            git commit -m "chore: FLIP monthly list [skip ci]"
            if git push; then exit 0; fi
            echo "Push odrzucony (próba $attempt) — ponawiam."
            sleep $((attempt * 3))
          done
          exit 1

  deploy:
    needs: refresh
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Recalculate indicators from cached data (no market-data downloads)
        run: python watchlist.py --build-only
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
